name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
      - name: Run shellcheck
        run: shellcheck hugov bin/repo/release/postrelease
